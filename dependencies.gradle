// 依赖声明独立维护，结构参考 ae2wcwt-forge-1.20.1。
// ForgeGradle 6 下所有 Minecraft 模组依赖都通过 fg.deobf 重映射。
dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // === 迁移期核心编译/运行依赖 ===
    implementation fg.deobf("appeng:appliedenergistics2-forge:${ae2_version}")
    implementation fg.deobf("${create_modrinth_coordinate}")
    implementation fg.deobf("net.createmod.ponder:Ponder-Forge-${minecraft_version}:1.0.91")
    compileOnly fg.deobf("dev.engine-room.flywheel:flywheel-forge-api-${minecraft_version}:1.0.5")
    runtimeOnly fg.deobf("dev.engine-room.flywheel:flywheel-forge-${minecraft_version}:1.0.5")
    runtimeOnly fg.deobf("dev.engine-room.vanillin:vanillin-forge-${minecraft_version}:1.0.0")
    implementation fg.deobf("maven.modrinth:applied-energistics-2-wireless-terminals:${ae2wtlib_version}")
    implementation fg.deobf("maven.modrinth:glodium:${glodium_version}")

    // 源模组中的可选集成 API（仅用于编译，具体模组仍由运行时集合提供）
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
    compileOnly fg.deobf("dev.emi:emi-forge:${emi_version}+${minecraft_version}")
    compileOnly fg.deobf("curse.maven:jade-324717:${jade_file}")

    // === AE2-Pattern-Workstation 的运行时依赖全集 ===
    runtimeOnly fg.deobf("dev.emi:emi-forge:${emi_version}+${minecraft_version}")
    runtimeOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")
    runtimeOnly fg.deobf("curse.maven:jade-324717:${jade_file}")

    runtimeOnly fg.deobf("com.gregtechceu.gtceu:gtceu-${minecraft_version}:${gtceu_version}:slim")
    runtimeOnly fg.deobf("com.lowdragmc.ldlib:ldlib-forge-${minecraft_version}:${ldlib_version}")
    // Registrate 已由 Create 6.0.8 内嵌；再次加入会产生 JPMS 重复模块冲突。
    runtimeOnly fg.deobf("maven.modrinth:3WjjSM5O:h7CBg2Oe") // Configuration 3.1.0

    runtimeOnly fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}")
    runtimeOnly fg.deobf("me.shedaniel.cloth:cloth-config-forge:${cloth_version}")
    runtimeOnly fg.deobf("dev.architectury:architectury-forge:${architectury_version}")
    runtimeOnly fg.deobf("org.appliedenergistics:guideme:${guideme_version}")

    runtimeOnly fg.deobf("maven.modrinth:extended-ae:${extendedae_epp_version}")
    compileOnly fg.deobf("curse.maven:programmed-circuit-card-1150540:7152160")
    compileOnly fg.deobf("curse.maven:just-enough-characters-250702:6680042")
    clientRuntimeOnly fg.deobf("curse.maven:just-enough-characters-250702:6680042")
    runtimeOnly fg.deobf("maven.modrinth:advancedae:${advancedae_version}")
    runtimeOnly fg.deobf("software.bernie.geckolib:geckolib-forge-1.20.1:${geckolib_version}")
    runtimeOnly fg.deobf("maven.modrinth:appflux:${appflux_version}")
    runtimeOnly fg.deobf("maven.modrinth:extendedae-plus:${extendedae_plus_version}")
    runtimeOnly fg.deobf("maven.modrinth:ae2-crystal-science:${ae2cs_version}")
    runtimeOnly fg.deobf("maven.modrinth:mekanism:${mekanism_version}")
    runtimeOnly fg.deobf("maven.modrinth:mekanism-generators:${mekanism_version}")
    runtimeOnly fg.deobf("maven.modrinth:applied-mekanistics:${applied_mek_version}")
    runtimeOnly fg.deobf("maven.modrinth:ae2-wcwt:${ae2wcwt_version}")
    runtimeOnly fg.deobf("maven.modrinth:cucumber:${cucumber_version}")
    runtimeOnly fg.deobf("maven.modrinth:mystical-agriculture:${mystical_agriculture_version}")
    runtimeOnly fg.deobf("maven.modrinth:mystical-agradditions:${mystical_agradditions_version}")
    runtimeOnly fg.deobf("curse.maven:cosmetic-armor-reworked-237307:4600191")

    // 客户端工具类依赖：仅加入 runClient，不能进入 dedicated server classpath。
    clientRuntimeOnly fg.deobf("maven.modrinth:justenoughcharacters:${jecharacters_version}")
    clientRuntimeOnly fg.deobf("maven.modrinth:extreme_sound_muffler:${sound_muffler_version}")
    clientRuntimeOnly fg.deobf("maven.modrinth:M4vJe1FJ:xyB6Pr5e") // caramelChat
    clientRuntimeOnly fg.deobf("maven.modrinth:mouse-tweaks:${mouse_tweaks_version}")
    clientRuntimeOnly fg.deobf("maven.modrinth:fuuu3xnx:PM9yAW1G") // Searchables
    clientRuntimeOnly fg.deobf("maven.modrinth:controlling:${controlling_version}")
}


// 可选兼容 API：仅用于编译，未安装时由 ModList 检测跳过。
dependencies {
    compileOnly fg.deobf("curse.maven:ftb-ultimine-forge-386134:5363345")
}
