name: Build Forge 1.20.1

on:
  push:
    branches: [forge-1.20.1, 1.20.1-forge]
  pull_request:
    branches: [forge-1.20.1, 1.20.1-forge]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forge-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Test release tooling (no network or publication)
        run: python -m unittest discover -s tools/tests -v
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Build and compile integration tests
        run: |
          chmod +x ./gradlew
          ./gradlew clean build gameTestClasses --no-daemon --stacktrace '-Dorg.gradle.jvmargs=-Xmx4G'
      - name: Upload mod JAR
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: createpackage-forge-1.20.1
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-dev.jar
            !build/libs/*-javadoc.jar
          if-no-files-found: error
          retention-days: 14
      - name: Upload JUnit reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: forge-test-reports
          path: build/reports/tests/test/
          if-no-files-found: ignore
          retention-days: 14
