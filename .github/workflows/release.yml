name: Release Forge tag

on:
  push:
    tags:
      - 'v20.1.*'
      - '20.1.*'
      - 'forge-1.20.1-v20.1.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing Forge tag, e.g. forge-1.20.1-v20.1.2'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: forge-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event.deleted != true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Reject force-moved release tags
        env:
          FORCED: ${{ github.event.forced }}
        run: |
          if [ "$FORCED" = "true" ]; then
            echo 'Release tags must be immutable; create a new version/tag instead.' >&2
            exit 1
          fi
      - name: Check out exact release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify tag, branch lineage and version changelog
        id: metadata
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          NOTES_FILE: ${{ runner.temp }}/forge-release-notes.md
        run: |
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          git merge-base --is-ancestor HEAD origin/forge-1.20.1
          python tools/release_metadata.py --tag "$RELEASE_TAG" --output "$NOTES_FILE"
      - name: Test release tooling
        run: python -m unittest discover -s tools/tests -v
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Build tested Forge mod
        run: |
          chmod +x ./gradlew
          ./gradlew clean build gameTestClasses --no-daemon --stacktrace '-Dorg.gradle.jvmargs=-Xmx4G'
      - name: Validate exact release JAR
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          MOD_VERSION: ${{ steps.metadata.outputs.version }}
          NOTES_FILE: ${{ runner.temp }}/forge-release-notes.md
        run: |
          python tools/release_metadata.py --tag "$RELEASE_TAG" --output "$NOTES_FILE" \
            --jar "build/libs/createpackage-$MOD_VERSION.jar" --check-java17
      - name: Save built JAR even if release upload fails
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: createpackage-forge-${{ steps.metadata.outputs.version }}
          path: build/libs/createpackage-${{ steps.metadata.outputs.version }}.jar
          if-no-files-found: error
          retention-days: 14
      - name: Attach JAR, then publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          MOD_VERSION: ${{ steps.metadata.outputs.version }}
          NOTES_FILE: ${{ runner.temp }}/forge-release-notes.md
        run: |
          python tools/create_github_release.py --repo "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" \
            --jar "build/libs/createpackage-$MOD_VERSION.jar" --notes "$NOTES_FILE"

  # GITHUB_TOKEN-created release events do NOT start another workflow; call explicitly.
  publish:
    needs: release
    permissions:
      contents: write
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
    secrets: inherit
