name: Bug 反馈
description: 报告 Forge 1.20.1 分支中可复现的问题
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 感谢反馈。请先使用最新的 1.20.1-forge 分支构建，并移除与复现无关的模组。
  - type: input
    id: versions
    attributes:
      label: 版本信息
      description: 请填写 Minecraft、Forge、Create、AE2 和 Create Package 的精确版本。
      placeholder: "MC 1.20.1 / Forge 47.4.10 / Create 6.0.8 / AE2 15.4.10 / Create Package 0.1.0"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 请提供尽可能精简、稳定的复现步骤。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为与实际行为
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志或崩溃报告
      description: 可粘贴关键片段，完整文件建议拖入输入框上传。请勿只提供截图。
      render: text
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 可附整合包环境、机器布局、截图或录像。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，未发现相同问题。
          required: true
        - label: 我已确认该问题可以在 Forge 1.20.1 分支复现。
          required: true
